<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>orbit</title>
  <link rel="icon" type="image/png" href="assets/Neon Flame Diamond Emblem.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 4v16M9 4v16M14 4l5 16"/></symbol>
    <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></symbol>
    <symbol id="i-classroom" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="1"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-proxy" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
    <symbol id="i-games" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="4"/><path d="M7 11v3M5.5 12.5h3M15.5 12h.01M18 14h.01"/></symbol>
    <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M5 9V5h4M15 5h4v4M19 15v4h-4M9 19H5v-4"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7M6 9.5V20h12V9.5"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 6v12L9 12zM6 6v12"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 6v12l9-6zM18 6v12"/></symbol>
  </svg>

  <nav class="desktop" aria-label="Desktop">
    <button type="button" data-open="player"><svg><use href="#i-music"/></svg>music</button>
    <button type="button" data-open="library"><svg><use href="#i-library"/></svg>library</button>
    <button type="button" data-open="lyrics"><svg><use href="#i-lyrics"/></svg>lyrics</button>
    <button type="button" data-open="classroom"><svg><use href="#i-classroom"/></svg>classroom</button>
    <button type="button" data-open="games"><svg><use href="#i-games"/></svg>games</button>
    <button type="button" data-open="proxy"><svg><use href="#i-proxy"/></svg>pr0xy</button>
  </nav>

  <section class="window" id="player" data-state="open" aria-label="Music player">
    <header class="titlebar">
      <span>music</span>
      <button type="button" data-action="minimize" aria-label="Minimize"><svg><use href="#i-min"/></svg></button>
      <button type="button" data-action="close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    </header>
    <div class="player-body">
      <div class="now">
        <strong id="trackName">nothing playing</strong>
        <span id="status" role="status" aria-live="polite">pick a song below</span>
      </div>

      <input id="progress" type="range" min="0" max="1000" value="0" aria-label="Song position" disabled>
      <div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>

      <div class="controls">
        <button type="button" id="prev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
        <button type="button" id="toggle" class="play" aria-pressed="false">play</button>
        <button type="button" id="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
        <button type="button" id="loop" class="loop">loop off</button>
      </div>

      <label class="volume">
        <span>vol</span>
        <input id="volume" type="range" min="0" max="100" value="35">
        <span id="volumeValue">35</span>
      </label>

      <div class="queue-head"><span>queue</span><span id="queueCount"></span></div>
      <ol class="songs numbered" id="queue"></ol>

      <label class="import">
        + import mp3 / mp4
        <input id="file" type="file" accept=".mp3,.mp4,audio/mpeg,audio/mp4,video/mp4" multiple>
      </label>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </section>

  <section class="window" id="library" data-state="closed" aria-label="Library" hidden>
    <header class="titlebar">
      <span>library</span>
      <button type="button" data-action="minimize" aria-label="Minimize"><svg><use href="#i-min"/></svg></button>
      <button type="button" data-action="close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    </header>
    <input id="search" type="search" placeholder="search" autocomplete="off" aria-label="Search songs">
    <ul class="songs" id="results"></ul>
  </section>

  <section class="window frame" id="lyrics" data-state="closed" aria-label="Lyrics" hidden>
    <header class="titlebar">
      <span>lyrics</span>
      <button type="button" data-action="fullscreen" aria-label="Fullscreen"><svg><use href="#i-full"/></svg></button>
      <button type="button" data-action="minimize" aria-label="Minimize"><svg><use href="#i-min"/></svg></button>
      <button type="button" data-action="close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    </header>
    <iframe title="Lyrics" data-src="https://www.musixmatch.com/" sandbox="allow-scripts allow-same-origin allow-forms" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </section>

  <section class="window frame" id="classroom" data-state="closed" aria-label="Classroom" hidden>
    <header class="titlebar">
      <span>classroom</span>
      <button type="button" data-action="home" aria-label="Home"><svg><use href="#i-home"/></svg></button>
      <button type="button" data-action="fullscreen" aria-label="Fullscreen"><svg><use href="#i-full"/></svg></button>
      <button type="button" data-action="minimize" aria-label="Minimize"><svg><use href="#i-min"/></svg></button>
      <button type="button" data-action="close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    </header>
    <iframe title="Classroom" data-src="https://brainworxedu.github.io/" sandbox="allow-scripts allow-same-origin allow-forms" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </section>

  <section class="window frame" id="games" data-state="closed" aria-label="Games" hidden>
    <header class="titlebar">
      <span>games</span>
      <button type="button" data-action="home" aria-label="Home"><svg><use href="#i-home"/></svg></button>
      <button type="button" data-action="fullscreen" aria-label="Fullscreen"><svg><use href="#i-full"/></svg></button>
      <button type="button" data-action="minimize" aria-label="Minimize"><svg><use href="#i-min"/></svg></button>
      <button type="button" data-action="close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    </header>
    <iframe title="Games" data-src="https://main-balance3221.b-cdn.net/" sandbox="allow-scripts allow-same-origin allow-forms" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </section>

  <section class="window frame" id="proxy" data-state="closed" aria-label="pr0xy" hidden>
    <header class="titlebar">
      <span>pr0xy</span>
      <button type="button" data-action="home" aria-label="Home"><svg><use href="#i-home"/></svg></button>
      <button type="button" data-action="fullscreen" aria-label="Fullscreen"><svg><use href="#i-full"/></svg></button>
      <button type="button" data-action="minimize" aria-label="Minimize"><svg><use href="#i-min"/></svg></button>
      <button type="button" data-action="close" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    </header>
    <iframe title="pr0xy" data-src="https://chevrolet.autos/" sandbox="allow-scripts allow-same-origin allow-forms" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </section>

  <nav class="taskbar" aria-label="Taskbar">
    <button type="button" data-task="player" class="running" aria-pressed="true"><svg><use href="#i-music"/></svg><span>music</span></button>
    <button type="button" data-task="library" aria-pressed="false"><svg><use href="#i-library"/></svg><span>library</span></button>
    <button type="button" data-task="lyrics" aria-pressed="false"><svg><use href="#i-lyrics"/></svg><span>lyrics</span></button>
    <button type="button" data-task="classroom" aria-pressed="false"><svg><use href="#i-classroom"/></svg><span>classroom</span></button>
    <button type="button" data-task="games" aria-pressed="false"><svg><use href="#i-games"/></svg><span>games</span></button>
    <button type="button" data-task="proxy" aria-pressed="false"><svg><use href="#i-proxy"/></svg><span>pr0xy</span></button>
    <time id="clock"></time>
  </nav>

  <script src="app.js"></script>
</body>
</html>
